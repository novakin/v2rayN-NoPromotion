name: Build v2rayN NoPromotion

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official v2rayN release tag (leave empty for latest)"
        required: false
        type: string
  schedule:
    - cron: "17 6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "patches/**"

permissions:
  contents: write

concurrency:
  group: v2rayn-nopromotion-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v7

      - name: Resolve upstream version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $tag = $env:REQUESTED_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = gh release view --repo 2dust/v2rayN --json tagName --jq .tagName
            if ($LASTEXITCODE -ne 0) { throw "Unable to query the latest upstream release." }
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Unable to resolve an upstream v2rayN release tag."
          }

          $customTag = "$tag-nopromotion.1"
          $exists = $false
          gh release view $customTag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          $global:LASTEXITCODE = 0

          # Scheduled checks do nothing when this upstream release is already built.
          # Push/manual runs intentionally rebuild and replace the custom assets so
          # builder fixes can be applied without inventing a new upstream version.
          $skip = $exists -and ($env:EVENT_NAME -eq "schedule")

          "upstream_tag=$tag" >> $env:GITHUB_OUTPUT
          "custom_tag=$customTag" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "skip=$($skip.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "Upstream release: $tag"
          Write-Host "Custom release:   $customTag"
          Write-Host "Already exists:   $exists"
          Write-Host "Skip this run:    $skip"

      - name: Checkout exact upstream release
        if: steps.version.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: 2dust/v2rayN
          ref: ${{ steps.version.outputs.upstream_tag }}
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Apply NoPromotion patch
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        working-directory: upstream
        run: |
          git apply --check ../patches/remove-promotion-ui.patch
          if ($LASTEXITCODE -ne 0) {
            throw "The Promotion patch no longer applies cleanly to upstream ${{ steps.version.outputs.upstream_tag }}. No build will be published."
          }
          git apply ../patches/remove-promotion-ui.patch

          $xaml = Get-Content "v2rayN/v2rayN/Views/MainWindow.xaml" -Raw
          if ($xaml -notmatch 'x:Name="menuPromotion"' -or $xaml -notmatch 'Visibility="Collapsed"') {
            throw "Post-patch validation failed."
          }

      - name: Create patched source archive
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.upstream_tag }}"
          $sourceDir = "patched-source"
          $sourceOut = "v2rayN-$tag-NoPromotion-source.zip"

          # Create the source archive before compiling so bin/obj output can never
          # leak into the corresponding-source package.
          New-Item -ItemType Directory -Path $sourceDir -Force | Out-Null
          Get-ChildItem "upstream" -Force | Where-Object { $_.Name -ne ".git" } | Copy-Item -Destination $sourceDir -Recurse -Force

          # A checked-out submodule contains its own .git marker file. Git metadata
          # is not source, so remove any remaining .git entries recursively.
          Get-ChildItem $sourceDir -Force -Recurse | Where-Object { $_.Name -eq ".git" } | Remove-Item -Recurse -Force

          @"
          This archive contains the corresponding source for the unofficial v2rayN $tag NoPromotion build.
          Modification: the Promotion toolbar entry and its adjacent separator are hidden in the Windows WPF UI.
          Build date (UTC): $(Get-Date -AsUTC -Format 'yyyy-MM-dd')
          Upstream: https://github.com/2dust/v2rayN/releases/tag/$tag
          "@ | Set-Content "$sourceDir/NOPROMOTION-MODIFICATION.txt" -Encoding utf8

          Compress-Archive -Path "$sourceDir/*" -DestinationPath $sourceOut -CompressionLevel Fastest

          $sourceHash = (Get-FileHash $sourceOut -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sourceHash  $sourceOut" | Set-Content "$sourceOut.sha256" -Encoding ascii

          "sourceartifact=$sourceOut" >> $env:GITHUB_ENV
          "sourcehashfile=$sourceOut.sha256" >> $env:GITHUB_ENV

      - name: Match upstream .NET toolchain
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          dotnet --list-sdks | ForEach-Object {
            if ($_ -match '^\S+\s+\[(.+)\]$') {
              $sdkPath = Join-Path $Matches[1] $_.Split()[0]
              if (Test-Path $sdkPath) {
                Write-Host "Removing preinstalled SDK $sdkPath"
                Remove-Item $sdkPath -Recurse -Force
              }
            }
          }

      - name: Setup .NET 10
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.1xx

      - name: Build Windows x64 WPF app
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        working-directory: upstream/v2rayN
        run: |
          dotnet --version
          dotnet publish ./v2rayN/v2rayN.csproj `
            -c Release `
            -r win-x64 `
            -p:SelfContained=true `
            -p:EnableWindowsTargeting=true `
            -o ../../custom-build

          if (!(Test-Path "../../custom-build/v2rayN.dll")) {
            throw "v2rayN.dll was not produced."
          }

      - name: Package from matching official release
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.upstream_tag }}"
          $asset = "v2rayN-windows-64.zip"
          $officialDir = "official"
          $officialZip = Join-Path $officialDir $asset
          $archiveDll = "v2rayN-windows-64\v2rayN.dll"
          $customDll = "custom-build/v2rayN.dll"

          if (!(Get-Command 7z -ErrorAction SilentlyContinue)) {
            throw "7-Zip is not available on the GitHub runner."
          }

          New-Item -ItemType Directory -Path $officialDir -Force | Out-Null
          gh release download $tag --repo 2dust/v2rayN --pattern $asset --dir $officialDir
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $officialZip)) {
            throw "Failed to download the matching official Windows x64 package."
          }

          # Extract only the upstream application assembly for validation. The output
          # ZIP itself starts as an exact copy of the official release package.
          New-Item -ItemType Directory -Path "official-extract" -Force | Out-Null
          & 7z x $officialZip $archiveDll "-oofficial-extract" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Failed to inspect the official package." }

          $officialDll = "official-extract/v2rayN-windows-64/v2rayN.dll"
          if (!(Test-Path $officialDll)) {
            throw "Unexpected upstream package layout: $archiveDll was not found."
          }

          $officialDllHash = (Get-FileHash $officialDll -Algorithm SHA256).Hash
          $customDllHash = (Get-FileHash $customDll -Algorithm SHA256).Hash
          Write-Host "Official v2rayN.dll SHA256: $officialDllHash"
          Write-Host "Patched  v2rayN.dll SHA256: $customDllHash"
          if ($officialDllHash -eq $customDllHash) {
            throw "Patched assembly is byte-identical to upstream; refusing to publish because the UI patch was not reflected in the build."
          }

          $officialDllSize = (Get-Item $officialDll).Length
          $customDllSize = (Get-Item $customDll).Length
          if ($customDllSize -gt ($officialDllSize * 1.20) -or $customDllSize -lt ($officialDllSize * 0.80)) {
            throw "Patched assembly size differs unexpectedly from upstream."
          }

          $out = "v2rayN-$tag-NoPromotion-windows-64.zip"
          Copy-Item $officialZip $out -Force

          # The XAML change is compiled into v2rayN.dll. Replace only that one archive
          # entry; every core, runtime file, helper executable and config remains the
          # exact file shipped in the matching official v2rayN release.
          $overlayDir = "overlay/v2rayN-windows-64"
          New-Item -ItemType Directory -Path $overlayDir -Force | Out-Null
          Copy-Item $customDll "$overlayDir/v2rayN.dll" -Force

          Push-Location overlay
          & 7z u -tzip -mx=1 "../$out" "v2rayN-windows-64\v2rayN.dll" | Out-Host
          $sevenZipExit = $LASTEXITCODE
          Pop-Location
          if ($sevenZipExit -ne 0) { throw "Failed to update the official package with the patched assembly." }

          $officialSize = (Get-Item $officialZip).Length
          $customSize = (Get-Item $out).Length
          $ratio = [math]::Round($customSize / $officialSize, 4)
          Write-Host "Official ZIP: $officialSize bytes"
          Write-Host "Custom ZIP:   $customSize bytes"
          Write-Host "Size ratio:   $ratio"

          # One application DLL is the only intended archive change. A package that
          # grows materially beyond upstream is therefore a packaging regression.
          if ($customSize -gt ($officialSize * 1.05)) {
            throw "Custom package is more than 5% larger than upstream; refusing to publish a malformed package."
          }

          # Re-extract the DLL from the final archive and prove it is our patched DLL.
          Remove-Item "final-check" -Recurse -Force -ErrorAction SilentlyContinue
          & 7z x $out $archiveDll "-ofinal-check" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Failed to validate final package." }
          $finalDllHash = (Get-FileHash "final-check/v2rayN-windows-64/v2rayN.dll" -Algorithm SHA256).Hash
          if ($finalDllHash -ne $customDllHash) {
            throw "Final package does not contain the patched assembly."
          }

          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $out" | Set-Content "$out.sha256" -Encoding ascii

          "artifact=$out" >> $env:GITHUB_ENV
          "hashfile=$out.sha256" >> $env:GITHUB_ENV

      - name: Publish custom release
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $upstreamTag = "${{ steps.version.outputs.upstream_tag }}"
          $customTag = "${{ steps.version.outputs.custom_tag }}"
          $releaseExists = "${{ steps.version.outputs.exists }}" -eq "true"

          $notes = @"
          Unofficial Windows x64 WPF build of **v2rayN $upstreamTag** with one UI-only change: the Promotion toolbar entry is hidden.

          - Upstream source/release: https://github.com/2dust/v2rayN/releases/tag/$upstreamTag
          - Customization: patches/remove-promotion-ui.patch
          - The binary ZIP starts from the matching official v2rayN-windows-64.zip package and replaces only v2rayN.dll, where the WPF XAML is compiled.
          - All bundled proxy cores, .NET runtime files, helper executables and configuration files remain from the official package.
          - The patched corresponding-source archive is attached.
          - No routing, proxy-core, DNS, or networking behavior is intentionally modified.

          SHA-256 files are attached alongside both ZIP archives.
          "@

          if ($releaseExists) {
            gh release upload $customTag `
              $env:artifact `
              $env:hashfile `
              $env:sourceartifact `
              $env:sourcehashfile `
              "patches/remove-promotion-ui.patch" `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to replace release assets." }

            gh release edit $customTag `
              --repo $env:GITHUB_REPOSITORY `
              --title "v2rayN $upstreamTag NoPromotion" `
              --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to update release notes." }
          }
          else {
            gh release create $customTag `
              $env:artifact `
              $env:hashfile `
              $env:sourceartifact `
              $env:sourcehashfile `
              "patches/remove-promotion-ui.patch" `
              --repo $env:GITHUB_REPOSITORY `
              --title "v2rayN $upstreamTag NoPromotion" `
              --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create custom release." }
          }

      - name: Nothing to do
        if: steps.version.outputs.skip == 'true'
        shell: pwsh
        run: Write-Host "NoPromotion release ${{ steps.version.outputs.custom_tag }} already exists; scheduled check is complete."
