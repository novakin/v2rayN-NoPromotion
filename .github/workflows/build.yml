name: Build v2rayN NoPromotion

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official stable v2rayN tag (empty = latest)"
        required: false
        type: string
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main, feature/quick-split-rule]
    paths:
      - ".github/workflows/build.yml"
      - "patches/**"
      - "tests/**"
      - "revision.txt"

permissions:
  contents: read
concurrency:
  group: nopromotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout builder
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release and revision
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          $tag = $env:REQUESTED_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = gh api repos/2dust/v2rayN/releases/latest --jq .tag_name
            if ($LASTEXITCODE -ne 0) { throw "Upstream release lookup failed." }
          }
          if ($tag -notmatch '^v?\d+\.\d+\.\d+(\.\d+)?$') { throw "Expected a numeric stable upstream tag." }
          $revision = (Get-Content revision.txt -Raw).Trim()
          if ($revision -notmatch '^[1-9]\d*$') { throw "Invalid builder revision." }
          $customTag = "$tag-nopromotion.$revision"
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$customTag" 2> release-error.txt
          $exists = $LASTEXITCODE -eq 0
          $draft = $false
          if ($exists) { $draft = ($releaseJson | ConvertFrom-Json).draft }
          elseif ((Get-Content release-error.txt -Raw) -notmatch 'HTTP 404') { throw "Custom release lookup failed." }
          $global:LASTEXITCODE = 0
          $skip = $exists -and !$draft -and ($env:GITHUB_REF -eq 'refs/heads/main')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "custom_tag=$customTag" >> $env:GITHUB_OUTPUT
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "skip=$($skip.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Upstream: $tag; custom release: $customTag; skip published release: $skip"

      - name: Checkout exact upstream tag
        if: steps.version.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: 2dust/v2rayN
          ref: refs/tags/${{ steps.version.outputs.tag }}
          path: upstream
          submodules: recursive
          persist-credentials: false

      - name: Apply ordered patches
        if: steps.version.outputs.skip != 'true'
        working-directory: upstream
        run: |
          $patches = @(Get-Content ../patches/series | Where-Object { $_.Trim() -ne '' -and !$_.StartsWith('#') })
          if ($patches.Count -eq 0) { throw "Empty patch series." }
          foreach ($patch in $patches) {
            if ($patch -notmatch '^[a-zA-Z0-9_.-]+\.patch$') { throw "Invalid patch filename." }
            git apply --check "../patches/$patch"
            if ($LASTEXITCODE -ne 0) { throw "Patch no longer applies: $patch. Nothing will be published." }
            git apply "../patches/$patch"
            if ($LASTEXITCODE -ne 0) { throw "Patch application failed: $patch." }
          }
          [xml]$xaml = Get-Content v2rayN/v2rayN/Views/MainWindow.xaml -Raw
          $ns = New-Object System.Xml.XmlNamespaceManager($xaml.NameTable)
          $ns.AddNamespace('x', 'http://schemas.microsoft.com/winfx/2006/xaml')
          $promotion = $xaml.SelectSingleNode('//*[@x:Name="menuPromotion"]', $ns)
          if ($null -eq $promotion -or $promotion.ParentNode.GetAttribute('Visibility') -ne 'Collapsed') {
            throw "Promotion visibility validation failed."
          }
          $quick = $xaml.SelectSingleNode('//*[@x:Name="menuQuickSplitRule"]', $ns)
          if ($null -eq $quick -or $quick.GetAttribute('Click') -ne 'MenuQuickSplitRule_Click') { throw "Quick Split Rule menu integration is missing." }
          if ((Get-Content v2rayN/Directory.Build.props -Raw) -notmatch '<PublishSingleFile>true</PublishSingleFile>') {
            throw "Upstream single-file packaging changed; review required."
          }

      - name: Setup .NET
        if: steps.version.outputs.skip != 'true'
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.1xx

      - name: Select installed SDK without deleting runner SDKs
        if: steps.version.outputs.skip != 'true'
        env:
          SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          $sdk = @{ version = $env:SDK_VERSION; rollForward = 'disable'; allowPrerelease = $false }
          $global = Get-Content upstream/global.json -Raw | ConvertFrom-Json
          if ($global.PSObject.Properties.Name -contains 'sdk') {
            throw "Upstream now specifies its SDK; review the toolchain selection before publishing."
          }
          $global | Add-Member -NotePropertyName sdk -NotePropertyValue $sdk
          $global | ConvertTo-Json -Depth 20 | Set-Content upstream/global.json -Encoding utf8
          @{ sdk = $sdk } | ConvertTo-Json | Set-Content global.json -Encoding utf8
          dotnet --version
          if ($LASTEXITCODE -ne 0) { throw "SDK selection failed." }

      - name: Archive patched source before compilation
        if: steps.version.outputs.skip != 'true'
        env:
          CUSTOM_TAG: ${{ steps.version.outputs.custom_tag }}
        run: |
          New-Item -ItemType Directory patched-source | Out-Null
          Get-ChildItem upstream -Force | Where-Object Name -ne '.git' | Copy-Item -Destination patched-source -Recurse -Force
          Get-ChildItem patched-source -Force -Recurse | Where-Object Name -eq '.git' | Remove-Item -Recurse -Force
          New-Item -ItemType Directory patched-source/nopromotion-build | Out-Null
          Copy-Item patches,tests,.github,revision.txt,README.md -Destination patched-source/nopromotion-build -Recurse -Force
          $upstreamSha = git -C upstream rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Cannot record source commit." }
          @"
          Unofficial v2rayN $env:CUSTOM_TAG.
          Changes: Promotion hidden; Quick Split Rule dialog added. Proxy engines are unchanged.
          Upstream commit: $upstreamSha
          Builder commit: $env:GITHUB_SHA
          Build date UTC: $(Get-Date -AsUTC -Format yyyy-MM-dd)
          See nopromotion-build/README.md and the included workflow/patches/tests for build instructions.
          "@ | Set-Content patched-source/NOPROMOTION-MODIFICATION.txt -Encoding utf8
          $source = "v2rayN-$env:CUSTOM_TAG-source.zip"
          Push-Location patched-source
          & 7z a -tzip -mx=5 "../$source" . | Out-Host
          $exitCode = $LASTEXITCODE
          Pop-Location
          if ($exitCode -ne 0) { throw "Source archive creation failed." }
          "sourceartifact=$source" >> $env:GITHUB_ENV

      - name: Test Quick Split Rule validation and persistence
        if: steps.version.outputs.skip != 'true'
        run: |
          dotnet run --project tests/QuickSplitRule/QuickSplitRule.Tests.csproj -c Release -p:PublishSingleFile=false -p:SelfContained=false
          if ($LASTEXITCODE -ne 0) { throw "Quick Split Rule tests failed; no release will be published." }

      - name: Build Windows x64 WPF
        if: steps.version.outputs.skip != 'true'
        working-directory: upstream/v2rayN
        run: |
          dotnet publish ./v2rayN/v2rayN.csproj -c Release -r win-x64 -p:SelfContained=true -p:EnableWindowsTargeting=true -o ../../custom-build
          if ($LASTEXITCODE -ne 0 -or !(Test-Path ../../custom-build/v2rayN.exe)) { throw "WPF build failed." }

      - name: Replace only the application in the official ZIP
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.version.outputs.tag }}
          CUSTOM_TAG: ${{ steps.version.outputs.custom_tag }}
        run: |
          gh release download $env:UPSTREAM_TAG --repo 2dust/v2rayN --pattern v2rayN-windows-64.zip --dir official
          if ($LASTEXITCODE -ne 0) { throw "Official package download failed." }
          $out = "v2rayN-$env:CUSTOM_TAG-windows-64.zip"
          Copy-Item official/v2rayN-windows-64.zip $out
          New-Item -ItemType Directory overlay/v2rayN-windows-64 -Force | Out-Null
          Copy-Item custom-build/v2rayN.exe overlay/v2rayN-windows-64/v2rayN.exe
          Push-Location overlay
          & 7z a -tzip -mx=1 "../$out" 'v2rayN-windows-64\v2rayN.exe' | Out-Host
          $exitCode = $LASTEXITCODE
          Pop-Location
          if ($exitCode -ne 0) { throw "Package update failed." }
          python tests/verify-package.py official/v2rayN-windows-64.zip $out custom-build/v2rayN.exe
          if ($LASTEXITCODE -ne 0) { throw "Package validation failed." }
          foreach ($file in @($out, $env:sourceartifact)) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file" | Set-Content "$file.sha256" -Encoding ascii
          }
          "artifact=$out" >> $env:GITHUB_ENV
          "Validated package: $out ($((Get-Item $out).Length) bytes)." >> $env:GITHUB_STEP_SUMMARY

      - name: Publish a new custom revision
        if: steps.version.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.version.outputs.tag }}
          CUSTOM_TAG: ${{ steps.version.outputs.custom_tag }}
          RELEASE_EXISTS: ${{ steps.version.outputs.exists }}
        run: |
          @"
          ## Quick Split Rule
          Open **Settings -> Quick Split Rule** to add a domain, IP/CIDR, or Windows executable-name rule to your active routing profile.
          Choose Direct/Proxy, exact host/subdomains, and insertion position. A rule preview and local backup precede saving. Process rules require TUN.
          Existing rules and profile settings are preserved; stale edits cannot overwrite newer rules. Reload after saving is optional and briefly interrupts connections.

          The Promotion entry remains hidden. This is an unofficial Windows x64 WPF build, not an upstream v2rayN release.
          Upstream: https://github.com/2dust/v2rayN/releases/tag/$env:UPSTREAM_TAG
          Builder commit: $env:GITHUB_SHA
          Build: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          Automated validation covers rule construction, placement, backups, database writes, and package integrity. The WPF project is compiled; an interactive Windows UI test is still recommended.
          The package differs from the official ZIP only in v2rayN.exe. Proxy cores remain unchanged. No new application dependencies or database schema are introduced.
          The executable is unsigned. The built-in application updater still installs official builds and can remove these customizations.
          Attached: binary, patched source (including build recipe/tests), and SHA-256 files. Do not confuse the builder-only GitHub auto-generated source ZIP with the attached patched source.
          "@ | Set-Content release-notes.md -Encoding utf8
          if ($env:RELEASE_EXISTS -ne 'true') {
            gh release create $env:CUSTOM_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "v2rayN $env:CUSTOM_TAG - Quick Split Rule" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "Draft release creation failed." }
          }
          gh release upload $env:CUSTOM_TAG $env:artifact "$env:artifact.sha256" $env:sourceartifact "$env:sourceartifact.sha256" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Asset upload failed; release remains a draft." }
          gh release edit $env:CUSTOM_TAG --repo $env:GITHUB_REPOSITORY --draft=false --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }

      - name: Already published
        if: steps.version.outputs.skip == 'true'
        run: Write-Host 'This custom revision is already published. Bump revision.txt for a new feature or fix; existing published assets are not replaced.'
