name: Quick Split Rule test build

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Official release tag to test
        default: '7.24.9'
        required: true
        type: string
  push:
    branches: ['feature/quick-split-rule']
    paths:
      - '.github/workflows/quick-split-test.yml'
      - 'patches/quick-split-rule.patch'
      - 'patches/remove-promotion-ui.patch'
      - 'tests/quick-split/**'

permissions:
  contents: write

concurrency:
  group: quick-split-test
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve test release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag || '7.24.9' }}
        run: |
          $tag = $env:REQUESTED_TAG.Trim()
          if ($tag -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a numeric official release tag.' }
          $releaseJson = gh api "repos/2dust/v2rayN/releases/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Official release was not found.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) { throw 'Select an official stable release.' }
          $asset = @($release.assets | Where-Object name -eq 'v2rayN-windows-64.zip')
          if ($asset.Count -ne 1 -or $asset[0].digest -notmatch '^sha256:[0-9a-fA-F]{64}$') {
            throw 'Expected Windows x64 asset and SHA-256 digest were not found.'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "UPSTREAM_TAG=$tag" >> $env:GITHUB_ENV
          "OFFICIAL_SHA=$($asset[0].digest.Substring(7))" >> $env:GITHUB_ENV
          "TEST_TAG=$tag-quicksplit-test.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_ENV
          "PACKAGE=v2rayN-$tag-NoPromotion-QuickSplit-test.$env:GITHUB_RUN_NUMBER-windows-64.zip" >> $env:GITHUB_ENV

      - name: Checkout exact upstream tag
        uses: actions/checkout@v7
        with:
          repository: 2dust/v2rayN
          ref: refs/tags/${{ steps.version.outputs.tag }}
          path: upstream
          submodules: recursive
          persist-credentials: false

      - name: Apply both patches and validate UI integration
        working-directory: upstream
        run: |
          foreach ($patch in @('../patches/remove-promotion-ui.patch', '../patches/quick-split-rule.patch')) {
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) { throw "Patch no longer applies: $patch" }
            git apply $patch
            if ($LASTEXITCODE -ne 0) { throw "Patch failed: $patch" }
          }
          [xml]$xaml = Get-Content 'v2rayN/v2rayN/Views/MainWindow.xaml' -Raw
          $promotion = @($xaml.SelectNodes('//*[@*[local-name()="Name"]="menuPromotion"]'))
          if ($promotion.Count -ne 1 -or $promotion[0].ParentNode.GetAttribute('Visibility') -ne 'Collapsed') {
            throw 'Promotion menu validation failed.'
          }
          $quick = @($xaml.SelectNodes('//*[@*[local-name()="Name"]="menuQuickSplit"]'))
          if ($quick.Count -ne 1 -or $quick[0].GetAttribute('Click') -ne 'MenuQuickSplit_Click') {
            throw 'Quick Split toolbar integration failed.'
          }
          [xml]$dialog = Get-Content 'v2rayN/v2rayN/Views/QuickSplitWindow.xaml' -Raw
          [xml]$props = Get-Content 'v2rayN/Directory.Build.props' -Raw
          if ($props.Project.PropertyGroup.PublishSingleFile -notcontains 'true') {
            throw 'Upstream single-file packaging changed; review before publishing.'
          }

      - name: Prepare corresponding source before compilation
        run: |
          New-Item -ItemType Directory -Path source -Force | Out-Null
          robocopy upstream source/upstream /E /XD .git /XF .git /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { throw 'Source copy failed.' }
          $global:LASTEXITCODE = 0
          New-Item -ItemType Directory -Path source/builder -Force | Out-Null
          Copy-Item patches,tests -Destination source/builder -Recurse
          Copy-Item .github/workflows/quick-split-test.yml source/builder/build-workflow.yml
          @"
          Unofficial NoPromotion + Quick Split Rule test build.
          Upstream tag: $env:UPSTREAM_TAG
          Upstream commit: $(git -C upstream rev-parse HEAD)
          Builder commit: $env:GITHUB_SHA
          Modification date (UTC): $(Get-Date -AsUTC -Format 'yyyy-MM-dd')
          Changes: hide Promotion; add Quick Split Rule dialog and additive rule editor.
          See builder/build-workflow.yml for exact build, test, and packaging commands.
          Upstream license and copyright notices are retained in upstream/LICENSE.
          "@ | Set-Content source/BUILD-NOTES.txt -Encoding utf8
          & 7z a -tzip -mx=5 'quicksplit-patched-source.zip' './source/*' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }

      - name: Setup SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.1xx'

      - name: Select SDK without deleting runner installations
        run: |
          if ((Test-Path upstream/global.json) -or (Test-Path upstream/v2rayN/global.json)) {
            throw 'Upstream now supplies SDK selection; review this test workflow.'
          }
          '{"sdk":{"version":"10.0.100","rollForward":"latestPatch","allowPrerelease":false}}' |
            Set-Content global.json -Encoding utf8
          dotnet --version
          if ($LASTEXITCODE -ne 0) { throw 'SDK selection failed.' }

      - name: Run Quick Split logic regression tests
        run: |
          dotnet run --project tests/quick-split/QuickSplit.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Quick Split tests failed. No test release will be published.' }

      - name: Compile Windows WPF test application
        working-directory: upstream/v2rayN
        run: |
          dotnet publish ./v2rayN/v2rayN.csproj -c Release -r win-x64 -p:SelfContained=true -p:EnableWindowsTargeting=true -o ../../custom-build
          if ($LASTEXITCODE -ne 0 -or !(Test-Path ../../custom-build/v2rayN.exe)) { throw 'WPF publish failed.' }

      - name: Package and compare every archive entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:UPSTREAM_TAG --repo 2dust/v2rayN --pattern 'v2rayN-windows-64.zip' --dir official
          if ($LASTEXITCODE -ne 0) { throw 'Official package download failed.' }
          $official = 'official/v2rayN-windows-64.zip'
          if ((Get-FileHash $official -Algorithm SHA256).Hash -ne $env:OFFICIAL_SHA) { throw 'Official asset digest mismatch.' }
          & 7z x $official '-oofficial-extract' -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Official package extraction failed.' }
          $entry = 'v2rayN-windows-64/v2rayN.exe'
          $originalExe = "official-extract/$entry"
          if (!(Test-Path $originalExe)) { throw 'Official package layout changed.' }
          $originalVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $originalExe)).FileVersion
          $newVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path 'custom-build/v2rayN.exe')).FileVersion
          if ($originalVersion -ne $newVersion) { throw 'Application version changed unexpectedly.' }
          New-Item -ItemType Directory -Path overlay/v2rayN-windows-64 -Force | Out-Null
          Copy-Item custom-build/v2rayN.exe "overlay/$entry"
          Copy-Item $official $env:PACKAGE
          Push-Location overlay
          try {
            & 7z a -tzip -mx=1 "../$env:PACKAGE" $entry | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'Archive update failed.' }
          } finally { Pop-Location }
          & 7z t $env:PACKAGE | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'ZIP integrity check failed.' }
          & 7z x $env:PACKAGE '-ofinal-check' -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Final archive extraction failed.' }
          $a = (Resolve-Path official-extract).Path
          $b = (Resolve-Path final-check).Path
          $oldFiles = @(Get-ChildItem $a -File -Recurse)
          $newFiles = @(Get-ChildItem $b -File -Recurse)
          if ($oldFiles.Count -ne $newFiles.Count) { throw 'Unexpected added or missing package files.' }
          $changed = @()
          foreach ($file in $oldFiles) {
            $relative = [IO.Path]::GetRelativePath($a, $file.FullName)
            $newFile = Join-Path $b $relative
            if (!(Test-Path $newFile)) { throw "Missing package file: $relative" }
            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash $newFile).Hash) { $changed += $relative.Replace('\','/') }
          }
          if ($changed.Count -ne 1 -or $changed[0] -ne $entry) { throw "Unexpected changed files: $changed" }
          if ((Get-FileHash "final-check/$entry").Hash -ne (Get-FileHash custom-build/v2rayN.exe).Hash) { throw 'Incorrect EXE in final archive.' }
          if ((Get-Item $env:PACKAGE).Length -gt (Get-Item $official).Length * 1.10) { throw 'Package size regression.' }
          Write-Host "Verified $($oldFiles.Count) package files; only v2rayN.exe differs."
          Write-Host "Official bytes: $((Get-Item $official).Length); test bytes: $((Get-Item $env:PACKAGE).Length)"
          foreach ($file in @($env:PACKAGE, 'quicksplit-patched-source.zip')) {
            "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())  $file" | Set-Content "$file.sha256" -Encoding ascii
          }

      - name: Publish separate prerelease (never replace stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          Quick Split Rule experimental Windows x64 WPF build on official v2rayN $env:UPSTREAM_TAG.

          Open **Quick Split** in the main toolbar. Supports literal domains (exact or with subdomains), IPv4/IPv6/CIDR, and executable names in TUN mode. Direct/Proxy, insertion preview, exact duplicate checks, automatic rules backup, optional reload. English UI for this first test.

          This is a test release, not the stable NoPromotion build. Back up your working folder and fully exit v2rayN before testing. To keep your existing cores/settings, replace only v2rayN.exe from this ZIP. Do not overwrite bin or guiConfigs. To undo a rule, remove its Quick Split entry in Routing settings; a JSON rules backup is also saved under the application's backup/quick-split folder.

          Earlier rules can still take priority. Geosite/geoip groups, regex, process paths and custom external core configs remain in the full editor. No route simulator or core changes. Compiled and logic-tested in CI; visual behavior and real network routing still require manual testing. The EXE remains unsigned. Built-in updates still point upstream.

          Builder commit: $env:GITHUB_SHA
          Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Only v2rayN.exe differs from the official package; all other files are hash-compared. Corresponding source, both patches and SHA-256 files are attached.
          "@ | Set-Content test-release-notes.md -Encoding utf8
          gh release create $env:TEST_TAG $env:PACKAGE "$env:PACKAGE.sha256" quicksplit-patched-source.zip quicksplit-patched-source.zip.sha256 patches/remove-promotion-ui.patch patches/quick-split-rule.patch --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "v2rayN $env:UPSTREAM_TAG - Quick Split test $env:GITHUB_RUN_NUMBER" --notes-file test-release-notes.md --prerelease --latest=false --draft
          if ($LASTEXITCODE -ne 0) { throw 'Test release upload failed.' }
          gh release edit $env:TEST_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Test release publication failed.' }
